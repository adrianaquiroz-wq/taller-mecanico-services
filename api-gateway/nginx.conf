events { 
    worker_connections 1024; 
}

http {
    # CARACTERÍSTICA TRANSVERSAL 1: Logging y Tracing Centralizado
    log_format custom_tracing '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log custom_tracing;

    upstream backend_service {
        server backend:3000;
    }

    server {
        listen 80;

        # CARACTERÍSTICA TRANSVERSAL 2: Manejo Global de CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

        location / {
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}